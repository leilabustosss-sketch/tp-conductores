<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Vehiculo</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div>
        <nav class="navbar navbar-expand-lg bg-body">
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="index1.html">Registrar Conductor</a></li>
                    <li class="nav-item"><a class="nav-link" href="index3.html">Registrar Vehículo</a></li>
                    <li class="nav-item"><a class="nav-link " href="index2.html">Ver Conductores</a></li>
                    <li class="nav-item"><a class="nav-link" href="index4.html">Ver Vehículos</a></li>
                    <li class="nav-item"><a class="nav-link" href="index5.html">General y Filtro</a></li>
                </ul>
            </div>
        </nav>

        <main>
            <div class="texto">
                <form onsubmit="return false;">
                    <label for="nombre_docente">Modelo</label>
                    <input type="text" id="nombre_docente">

                    <label for="edad_docente"> Año</label>
                    <input type="number" id="edad_docente">

                    <label for="asignatura">Carnet Requerido</label>
                    <input type="text" id="asignatura">

                    <div class="d-flex align-items-center gap-2 mt-2">
                        <input type="checkbox" id="seguro_vehiculo" style="width: auto; margin: 0;">
                        <label for="seguro_vehiculo" class="m-0">¿Tiene seguro al día?</label>
                    </div>
                </form>

                <div class="botones">
                    <button class="enviar_db" type="button" onclick="guardar_db()">ENVIAR</button>
                    <button class="borrar_db" type="button" onclick="borrar_db()">BORRAR</button>
                </div>
            </div>
        </main>
    </div>

    <script src="scriptdb.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
